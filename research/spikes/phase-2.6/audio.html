<!doctype html>
<meta charset="utf-8">
<title>Audio</title>
<style>body { font: 15px -apple-system, sans-serif; margin: 40px; }</style>
<h1>Audio</h1>
<button id="play" onclick="play()">Play a quiet tone (1.5 s)</button>
<script>
// A WAV made here (a media element: CEF reports its start, our poll its end).
function tone(seconds) {
  const rate = 22050, n = Math.floor(rate * seconds), buffer = new ArrayBuffer(44 + n * 2), v = new DataView(buffer);
  const text = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  text(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); text(8, 'WAVE'); text(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); text(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(i / rate * 2 * Math.PI * 440) * 600, true);
  return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
}
function play() { const a = new Audio(tone(1.5)); a.volume = 0.2; a.play(); }
</script>
