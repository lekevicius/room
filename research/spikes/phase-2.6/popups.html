<!doctype html>
<meta charset="utf-8">
<title>Popups</title>
<style>body { font: 15px -apple-system, sans-serif; margin: 40px; } button { font-size: 15px; margin: 4px; }</style>
<h1>Popups</h1>
<button id="popup" onclick="openPopup()">window.open(…, "popup")</button>
<a id="blank" href="popup-child.html?via=blank" target="_blank">target=_blank</a>
<pre id="log"></pre>
<script>
window.__messages = [];
window.addEventListener('message', (e) => { window.__messages.push(e.data); document.getElementById('log').textContent = JSON.stringify(window.__messages); });
function openPopup() { window.__popup = window.open('popup-child.html?via=open', 'child', 'popup,width=420,height=320'); }
</script>
