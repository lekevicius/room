<!doctype html>
<meta charset="utf-8">
<title>Popups</title>
<style>body{font:15px -apple-system;margin:24px} a,button,select,input{display:block;margin:12px 0;font-size:15px}</style>
<h1>Popup and form-control spike</h1>
<a id="blank" href="data:text/html,<title>target blank</title><h1>opened with target=_blank</h1>" target="_blank">target=_blank link</a>
<button id="open" onclick="window.__popup = window.open('data:text/html,<title>window.open</title><h1>opened with window.open</h1>', 'w', 'width=400,height=300')">window.open()</button>
<select id="sel"><option>One</option><option>Two</option><option>Three</option><option>Four</option></select>
<input id="date" type="date">
<input id="color" type="color">
<button id="alert" onclick="alert('alert from page'); window.__alerted = true">alert()</button>
<button id="confirm" onclick="window.__confirmed = confirm('confirm from page')">confirm()</button>
