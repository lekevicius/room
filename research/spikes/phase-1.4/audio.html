<!doctype html>
<meta charset="utf-8">
<title>Audio</title>
<h1>Audibility spike</h1>
<audio id="a" loop></audio>
<script>
// A generated 440 Hz WAV, quiet (amplitude 0.05), 2 s, looped.
const rate = 22050, secs = 2, n = rate * secs, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
w(36, 'data'); v.setUint32(40, n * 2, true);
for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 440 * i / rate) * 0.05 * 32767, true);
document.getElementById('a').src = URL.createObjectURL(new Blob([buf], {type: 'audio/wav'}));
</script>
