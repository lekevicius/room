<!doctype html>
<meta charset="utf-8">
<title>Autofill</title>
<style>body{font:15px -apple-system;margin:24px} input{display:block;margin:10px 0;font-size:15px;width:280px}</style>
<h1>Autofill spike</h1>
<form id="f" action="form.html" method="get">
  <input name="name" autocomplete="name" placeholder="Name">
  <input name="email" type="email" autocomplete="email" placeholder="Email">
  <input name="street" autocomplete="street-address" placeholder="Street">
  <input name="username" autocomplete="username" placeholder="Username">
  <input name="password" type="password" autocomplete="current-password" placeholder="Password">
  <button type="submit">Submit</button>
</form>
