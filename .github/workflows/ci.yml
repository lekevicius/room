# Compile check of the app and its packages plus the package unit tests
# (FakeEngine), without the engine: the Room target of xcodegen/base.yml links
# no engine (ROOM_ENGINE=none); RoomCore builds stay local (no fork build on
# the runner).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project (no engine)
        run: xcodegen --spec xcodegen/ci.yml --project-root . --project .

      - name: Build and test
        run: |
          xcodebuild build test \
            -project Room.xcodeproj \
            -scheme Room \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
