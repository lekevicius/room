# Compile check of the app and its packages plus the package unit tests
# (FakeEngine), without the engine: the Room target of xcodegen/base.yml links
# no engine (ROOM_ENGINE=none); RoomCore builds stay local (no fork build on
# the runner).
name: CI

# Off since 2026-10-18 (B-93: the account's billing hold): runs only when
# started by hand from the Actions page; sessions run this spec locally before
# every push (AGENTS.md "Testing"). Restore push and pull_request when billing works.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Token drift (5.2a; a grep, no build)
        run: scripts/design-audit.sh --strict

      - name: Generate project (no engine)
        run: xcodegen --spec xcodegen/ci.yml --project-root . --project .

      - name: Build and test
        run: |
          xcodebuild build test \
            -project Room.xcodeproj \
            -scheme Room \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
