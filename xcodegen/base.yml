# Everything that builds without an engine distribution. project.yml adds
# Room.app on RoomCore and the embryo host (xcodegen/roomcore.yml); CI
# generates from xcodegen/ci.yml (base only: the engine-free Room target).
name: Room
options:
  bundleIdPrefix: app.room.desktop
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Apple silicon only: the fork build is arm64.
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "22"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Hardened runtime + Developer ID signing are exercised in Phase 1.4.
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    # PLAN §4 Identity: the shipping id is app.room.desktop (Release, the DMG).
    ROOM_BUNDLE_ID_SUFFIX: ""
  configs:
    # 5.0a: every Debug app (Room.app over either engine, the embryo host, the
    # engine-free CI build) is app.room.desktop.dev, so computer use, TCC grants,
    # AppleEvents, defaults and LaunchServices never reach the user's Room; its
    # default state is ~/Library/Application Support/Room Dev (Infra's AppPaths).
    Debug:
      ROOM_BUNDLE_ID_SUFFIX: .dev
      # A stable signature for the Debug apps (2026-10-21): ad-hoc builds get a
      # new code identity per build, so macOS forgot every grant (removable
      # volumes, camera, microphone, Bluetooth) at each rebuild. The Developer ID
      # identity keeps app.room.desktop.dev's TCC grants across builds; no
      # timestamp (offline, fast); the Debug app still uses the mock keychain
      # (App/Sources/main.swift). CI builds with CODE_SIGNING_ALLOWED=NO.
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: N56PMJ99UT
      OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
packages:
  Engine:
    path: Packages/Engine
  Design:
    path: Packages/Design
  UIKitCore:
    path: Packages/UIKitCore
  Card:
    path: Packages/Card
  Infra:
    path: Packages/Infra
  Model:
    path: Packages/Model
  Store:
    path: Packages/Store
  Sidebar:
    path: Packages/Sidebar
  Chrome:
    path: Packages/Chrome
  Tabs:
    path: Packages/Tabs
  Omnibox:
    path: Packages/Omnibox
  Palette:
    path: Packages/Palette
  Integration:
    path: Packages/Integration
  Library:
    path: Packages/Library
  Import:
    path: Packages/Import
# Settings Room.app has with or without its engine (the Room target here, the
# RoomCore app target in xcodegen/roomcore.yml).
settingGroups:
  RoomApp:
    PRODUCT_NAME: Room
    PRODUCT_MODULE_NAME: Room
    # PLAN §4 Identity (2026-10-04): app.room.desktop, helpers app.room.desktop.helper*
    # (the framework's, the same for every configuration); Debug adds .dev (5.0a).
    PRODUCT_BUNDLE_IDENTIFIER: app.room.desktop$(ROOM_BUNDLE_ID_SUFFIX)
    CODE_SIGN_ENTITLEMENTS: App/Resources/Room.entitlements
    # The one place for the update feed and the crash-report DSN (2.8b report).
    # The feed and the DMGs live in the R2 bucket behind updates.room.app (2026-10-21, the first release).
    ROOM_UPDATE_FEED_URL: https://updates.room.app/appcast.xml
    # Empty until a Sentry project exists; with it empty, crash reports stay off whatever the setting.
    ROOM_SENTRY_DSN: ""
    # EdDSA public key from Sparkle's generate_keys (2026-10-04, Mac mini; the private
    # key is in that Mac's login keychain, account "ed25519").
    SPARKLE_PUBLIC_ED_KEY: z1WE/kOA/sLq7Ou7T/lQ19moA5XdXnXOPkf1Gqxqh5Q=
    # App/Resources/AppIcon.icon (the user's Room.icon, 2026-10-08).
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    # ROOM_ENGINE (roomcore | none, PLAN §4 Engine selection) becomes the Swift
    # condition ROOM_ENGINE_ROOMCORE / ROOM_ENGINE_NONE for App's composition
    # root. RoomCore is the default (3.9: CEF deleted); the Room target below,
    # which CI builds without the fork, sets none.
    ROOM_ENGINE: roomcore
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ROOM_ENGINE_$(ROOM_ENGINE:upper)"
targets:
  Room:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: none
        excludes: ["Reader/**", "AppIcon.icon/**", "AppIcons/**", "ContentBlocking/**"]
      # The app icon (Icon Composer; actool compiles it into Assets.car and AppIcon.icns).
      - path: App/Resources/AppIcon.icon
        buildPhase: resources
      # Settings ▸ Appearance ▸ App Icon: the choices rendered to PNG (scripts/render-app-icons.sh),
      # copied as Resources/Rendered. The alternates' .icon documents beside them are sources only:
      # never compiled by actool, never in the bundle.
      - path: App/Resources/AppIcons/Rendered
        type: folder
        buildPhase: resources
      # Reader mode (4.7b): the distiller and the page template, copied as Resources/Reader.
      - path: App/Resources/Reader
        type: folder
        buildPhase: resources
      # Room's blocker (B-30): the bundled lists and autoconsent (scripts/content-blocking-assets.sh),
      # copied as Resources/ContentBlocking.
      - path: App/Resources/ContentBlocking
        type: folder
        buildPhase: resources
    # Info.plist is generated from here (xcodegen writes App/Resources/Info.plist).
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Room
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSEnvironment:
          MallocNanoZone: "0"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
        NSCameraUsageDescription: Websites you allow can use the camera.
        NSMicrophoneUsageDescription: Websites you allow can use the microphone.
        NSLocationUsageDescription: Websites you allow can use your location.
        NSLocationWhenInUseUsageDescription: Websites you allow can use your location.
        # Web Bluetooth and Web Serial (Bluetooth serial ports) touch Bluetooth: without
        # the key macOS ends the app (TCC; found by 3.4b's ui-serial drive).
        NSBluetoothAlwaysUsageDescription: Websites you allow can ask to use Bluetooth devices.
        # A web browser (ROADMAP 2.8 task 3, macos-ui-stack.md §7.4): http and https links,
        # and HTML documents and URL files from Finder's Open With.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html, public.xhtml]
          - CFBundleTypeName: Web location
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.url]
        # Sparkle 2 (ROADMAP 2.8 task 5): the updater stays stopped until the user turns
        # automatic checks on (Room's setting drives the schedule; Sparkle never asks itself).
        SUFeedURL: $(ROOM_UPDATE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        # Sentry (ROADMAP 2.8 task 5): read by BuildConfiguration.sentryDSN; empty = crash reports unavailable.
        RoomSentryDSN: $(ROOM_SENTRY_DSN)
    settings:
      groups: [RoomApp]
      base:
        # No engine: the app compiles with NoEngineApplication (CI's compile
        # check and the package tests, the scheme below). Room.app on RoomCore
        # is the RoomCoreApp target, scheme "Room (RoomCore)" (xcodegen/roomcore.yml).
        ROOM_ENGINE: none
    dependencies:
      - package: Engine
      - package: Design
      - package: UIKitCore
      - package: Card
      - package: Infra
      - package: Model
      - package: Store
      - package: Sidebar
      - package: Chrome
      - package: Tabs
      - package: Omnibox
      - package: Palette
      - package: Library
      - package: Import
      - package: Integration
        product: Integration
      - package: Integration
        product: Updates
      - package: Integration
        product: CrashReports
      # DEBUG sidebar captures run the tab controller on FakeEngine pages.
      - package: Engine
        product: FakeEngine
schemes:
  Room:
    build:
      targets:
        Room: all
    run:
      config: Debug
    # Package unit tests (Swift Testing); `swift test` in the package runs the same.
    test:
      config: Debug
      targets:
        - package: Engine/EngineTests
        - package: Design/DesignTests
        - package: Card/CardTests
        - package: UIKitCore/UIKitCoreTests
        - package: Model/ModelTests
        - package: Store/StoreTests
        - package: Sidebar/SidebarTests
        - package: Chrome/ChromeTests
        - package: Tabs/TabsTests
        - package: Omnibox/OmniboxTests
        - package: Palette/PaletteTests
        - package: Palette/AccessibilityAuditTests
        - package: Library/LibraryTests
        - package: Import/ImportTests
        - package: Integration/IntegrationTests
        - package: Infra/InfraTests
    archive:
      config: Release
