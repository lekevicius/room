# CEF engine: EngineCEF package, the five helper apps (CEF looks them up as
# "<executable> Helper*.app" in Contents/Frameworks), and the framework copy.
# Requires scripts/bootstrap-cef.sh to have populated Engine/cef/dist.
packages:
  EngineCEF:
    path: Packages/EngineCEF
targetTemplates:
  Helper:
    type: application
    platform: macOS
    sources:
      - path: Helpers/Sources
    settings:
      base:
        INFOPLIST_FILE: Helpers/Resources/Helper-Info.plist
        CODE_SIGN_ENTITLEMENTS: Helpers/Resources/Helper.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited)"
    dependencies:
      - package: EngineCEF
        product: CEFHelper
targets:
  Room Helper:
    templates: [Helper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.room.desktop.helper
  Room Helper (GPU):
    templates: [Helper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.room.desktop.helper.gpu
        CODE_SIGN_ENTITLEMENTS: Helpers/Resources/Helper-JIT.entitlements
  Room Helper (Renderer):
    templates: [Helper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.room.desktop.helper.renderer
        CODE_SIGN_ENTITLEMENTS: Helpers/Resources/Helper-JIT.entitlements
  Room Helper (Plugin):
    templates: [Helper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.room.desktop.helper.plugin
  Room Helper (Alerts):
    templates: [Helper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.room.desktop.helper.alerts
  Room:
    dependencies:
      - package: EngineCEF
        product: EngineCEF
      - target: Room Helper
        embed: true
        codeSign: true
        copy:
          destination: frameworks
      - target: Room Helper (GPU)
        embed: true
        codeSign: true
        copy:
          destination: frameworks
      - target: Room Helper (Renderer)
        embed: true
        codeSign: true
        copy:
          destination: frameworks
      - target: Room Helper (Plugin)
        embed: true
        codeSign: true
        copy:
          destination: frameworks
      - target: Room Helper (Alerts)
        embed: true
        codeSign: true
        copy:
          destination: frameworks
    postBuildScripts:
      - name: Embed Chromium Embedded Framework
        script: '"$SRCROOT/scripts/embed-cef-framework.sh"'
        basedOnDependencyAnalysis: false
