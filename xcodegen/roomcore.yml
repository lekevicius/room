# RoomCore engine (Phase 1.5 embryo): the Swift host `RoomCoreHost` (product
# Room.app, App/RoomCore) linked against RoomCore.framework from our Chromium
# fork. Build it with scripts/roomcore-package.sh, which stages the framework
# in build/roomcore and uses its own DerivedData (the CEF target also
# produces a Room.app). Nothing here is needed by the CEF app or CI.
targets:
  RoomCoreHost:
    type: application
    platform: macOS
    sources:
      - path: App/RoomCore
    settings:
      base:
        PRODUCT_NAME: Room
        PRODUCT_MODULE_NAME: RoomCoreHost
        PRODUCT_BUNDLE_IDENTIFIER: com.lekevicius.room
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Room.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/build/roomcore"
        # Component build: RoomCore re-exports libchrome_dll and ~500 dylibs
        # staged in the framework's Libraries/. The framework binary has no
        # header room for its own rpath, so the host supplies it (dyld also
        # searches the main executable's rpaths for @rpath loads).
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../Frameworks/RoomCore.framework/Versions/Current/Libraries"
        # ld does not resolve the re-exported @rpath/libchrome_dll.dylib at
        # link time, so the component-build host links it directly. A
        # non-component (release) RoomCore has no libchrome_dll: drop this then.
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/build/roomcore/RoomCore.framework/Versions/Current/Libraries"
        OTHER_LDFLAGS: "$(inherited) -lchrome_dll"
    dependencies:
      - package: Design
      - package: UIKitCore
      - package: Card
      - package: Infra
      - framework: build/roomcore/RoomCore.framework
        embed: false
    postBuildScripts:
      - name: Embed RoomCore.framework
        script: '"$SRCROOT/scripts/embed-roomcore-framework.sh"'
        basedOnDependencyAnalysis: false
schemes:
  Room (RoomCore):
    build:
      targets:
        RoomCoreHost: all
    run:
      config: Debug
