# RoomCore engine (Chapter 3; the only engine since 3.9). Two targets over
# RoomCore.framework, the framework scripts/roomcore-package.sh stages in
# build/roomcore from the Chromium fork's out directory; CI needs none of it.
#
#   RoomCoreApp   Room.app (App/Sources + EngineRoomCore, ROOM_ENGINE=roomcore,
#                 the default), scheme "Room (RoomCore)", built into
#                 build/roomcore/DerivedData (the engine-free Room target of
#                 xcodegen/base.yml also produces a Room.app, for CI)
#   RoomCoreHost  the Phase 1.5 embryo host (App/RoomCore) that the engine-level
#                 scripts drive (roomcore-baseline.sh, roomcore-features.sh,
#                 roomcore-netlog.sh), scheme "RoomCore Host", built into
#                 build/roomcore-host/DerivedData
packages:
  EngineRoomCore:
    path: Packages/EngineRoomCore
settingGroups:
  RoomCoreLink:
    # Where scripts/roomcore-package.sh staged the framework: build/roomcore
    # (component, out/dev) or, with --release, build/roomcore-release (static,
    # out/release; the script passes ROOMCORE_STAGE on the xcodebuild command
    # line, and this entry comes first in the search paths).
    ROOMCORE_STAGE: "$(SRCROOT)/build/roomcore"
    FRAMEWORK_SEARCH_PATHS: "$(ROOMCORE_STAGE)"
    # Component build: RoomCore re-exports libchrome_dll and ~500 dylibs
    # staged in the framework's Libraries/. The framework binary has no
    # header room for its own rpath, so the host supplies it (dyld also
    # searches the main executable's rpaths for @rpath loads).
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../Frameworks/RoomCore.framework/Versions/Current/Libraries"
    # ld does not resolve the re-exported @rpath/libchrome_dll.dylib at
    # link time, so the component-build host links it directly. A static
    # (release) RoomCore has no libchrome_dll: the package script empties
    # both settings for it.
    ROOMCORE_LIBRARY_PATH: "$(ROOMCORE_STAGE)/RoomCore.framework/Versions/Current/Libraries"
    ROOMCORE_COMPONENT_LDFLAGS: "-lchrome_dll"
    LIBRARY_SEARCH_PATHS: "$(inherited) $(ROOMCORE_LIBRARY_PATH)"
    OTHER_LDFLAGS: "$(inherited) $(ROOMCORE_COMPONENT_LDFLAGS)"
    # "ROOM_SPIKES" when the staged framework was built with
    # room_enable_spikes=true (scripts/roomcore-package.sh passes it).
    ROOM_SPIKES_CONDITION: ""
targets:
  RoomCoreApp:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: none
    settings:
      groups: [RoomApp, RoomCoreLink]
      base:
        # ROOM_ENGINE: roomcore from the RoomApp group (the default).
        # Generated by the Room target's `info:` block (xcodegen/base.yml).
        INFOPLIST_FILE: App/Resources/Info.plist
    dependencies:
      - package: Engine
      - package: Design
      - package: UIKitCore
      - package: Card
      - package: Infra
      - package: Model
      - package: Store
      - package: Sidebar
      - package: Chrome
      - package: Tabs
      - package: Omnibox
      - package: Palette
      - package: Library
      - package: Import
      - package: Integration
        product: Integration
      - package: Integration
        product: Updates
      - package: Integration
        product: CrashReports
      - package: Engine
        product: FakeEngine
      - package: EngineRoomCore
      - framework: build/roomcore/RoomCore.framework
        embed: false
    postBuildScripts:
      - name: Embed RoomCore.framework
        script: '"$SRCROOT/scripts/embed-roomcore-framework.sh"'
        basedOnDependencyAnalysis: false
  RoomCoreHost:
    type: application
    platform: macOS
    sources:
      - path: App/RoomCore
    settings:
      groups: [RoomCoreLink]
      base:
        PRODUCT_NAME: Room
        PRODUCT_MODULE_NAME: RoomCoreHost
        PRODUCT_BUNDLE_IDENTIFIER: app.room.desktop
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Room.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(ROOM_SPIKES_CONDITION)"
    dependencies:
      - package: Design
      - package: UIKitCore
      - package: Card
      - package: Infra
      - framework: build/roomcore/RoomCore.framework
        embed: false
    postBuildScripts:
      - name: Embed RoomCore.framework
        script: '"$SRCROOT/scripts/embed-roomcore-framework.sh"'
        basedOnDependencyAnalysis: false
schemes:
  Room (RoomCore):
    build:
      targets:
        RoomCoreApp: all
    run:
      config: Debug
  RoomCore Host:
    build:
      targets:
        RoomCoreHost: all
    run:
      config: Debug
